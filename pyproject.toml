[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ksef2-cli"
version = "0.0.2"
description = "Command-line interface for the ksef2 Python SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<8.2",
    "ksef2>=1.0,<2",
    "markdown-it-py>=3,<4",
    "pydantic>=2.13.4",
    "rich>=13.7,<14",
    "toml>=0.10.2",
    "typer>=0.12,<0.13",
]

[project.scripts]
ksef2 = "ksef2_cli.app:main"
ksef2-cli = "ksef2_cli.app:main"

[project.urls]
Documentation = "https://docs.stacking.me/cli/intro/"
Repository = "https://github.com/stacking-hq/ksef2-cli"
Issues = "https://github.com/stacking-hq/ksef2-cli/issues"

# TEMPORARY (until ksef2 1.0.0 is on PyPI, stacking-hq/ksef2#147).
# The CLI needs names that ksef2.models exports only from 1.0.0, so `ksef2>=1.0,<2`
# cannot resolve from PyPI yet and `uv sync` fails. Resolve it from the SDK release
# branch instead. `tool.uv.sources` is uv-only dev config: the built wheel still
# declares `Requires-Dist: ksef2<2,>=1.0`, so nothing unreleased is published.
# On release day, delete this table and run `uv lock -P ksef2` in its own commit.
[tool.uv.sources]
ksef2 = { git = "https://github.com/stacking-hq/ksef2.git", branch = "chore/08-release-1-0-0" }

[dependency-groups]
dev = [
    "coverage>=7.14,<8",
    "pytest>=9.0.3",
]

[tool.coverage.run]
source = ["src/ksef2_cli"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: direct tests for helpers and internal logic",
    "component: fake-backed CLI/component tests",
    "e2e: installed CLI and real external-system smoke tests",
]

[tool.hatch.build]
exclude = ["src/ksef2_cli/tui"]

[tool.hatch.build.targets.wheel]
packages = ["src/ksef2_cli"]
