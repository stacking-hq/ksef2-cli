[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ksef2-cli"
version = "1.0.0"
description = "Command-line interface for the ksef2 Python SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<8.2",
    "ksef2>=1.0,<2",
    "pydantic>=2.13.4",
    "rich>=13.7,<14",
    "typer>=0.12,<0.13",
]

[project.optional-dependencies]
# WeasyPrint renders `invoices export-pdf`. It is optional so the CLI imports and
# runs without it; the command reports the install hint when the extra is absent.
pdf = [
    "ksef2[pdf]>=1.0,<2",
]

[project.scripts]
ksef2 = "ksef2_cli.app:main"
ksef2-cli = "ksef2_cli.app:main"

[project.urls]
Documentation = "https://docs.stacking.me/cli/intro/"
Repository = "https://github.com/stacking-hq/ksef2-cli"
Issues = "https://github.com/stacking-hq/ksef2-cli/issues"

# DEVELOPMENT OVERRIDE - RELEASE BLOCKER: publish SDK 1.0 to PyPI first
# (stacking-hq/ksef2#147). Checked 2026-10-25: PyPI only has SDK <=0.22.2.
# This uv-only source does not enter wheel metadata; pip correctly refuses
# incompatible SDK versions. After SDK publication, remove this table and run
# `uv lock -P ksef2`. The >=1.0,<2 dependency bounds are already final.
[tool.uv.sources]
ksef2 = { git = "https://github.com/stacking-hq/ksef2.git", branch = "chore/08-release-1-0-0" }

[dependency-groups]
dev = [
    "coverage>=7.14,<8",
    "pytest>=9.0.3",
]

[tool.coverage.run]
source = ["src/ksef2_cli"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: direct tests for helpers and internal logic",
    "component: fake-backed CLI/component tests",
    "e2e: installed CLI and real external-system smoke tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ksef2_cli"]
