name: SDK head

# Release dependencies stay locked to PyPI. This job installs the SDK's main
# branch over that environment and runs without syncing back to the release
# lock, so unreleased SDK changes are checked independently of the release CI.
on:
  pull_request:
    branches:
      - next
  push:
    branches:
      - next
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  test-against-sdk-main:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'next' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --locked
      - name: Install unreleased SDK main
        run: uv pip install --python .venv/bin/python --upgrade "ksef2 @ git+https://github.com/stacking-hq/ksef2.git@main"
      - name: Verify SDK source and resolved commit
        run: uv pip freeze --python .venv/bin/python | grep -F 'ksef2 @ git+https://github.com/stacking-hq/ksef2.git@'
      - run: uv run --no-sync python -W error::DeprecationWarning -m pytest -q
